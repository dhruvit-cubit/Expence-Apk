<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kharcha Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column ledger. Sticky header, scrolling view, fixed 5-slot tab bar with a raised Add button. */
:root{
  --bg:#F0F3F1; --surface:#FFFFFF; --soft:#E5EBE8; --ink:#14211D; --muted:#566660; --line:#D6DFDA;
  --accent:#243F8F; --accent-ink:#FFFFFF;
  --good:#0F7A53; --good-bg:#DAF2E7; --warn:#8F4400; --warn-bg:#FDEFD0; --bad:#B3261E; --bad-bg:#FCE4E1;
  --c-home:#2D6CDF; --c-loan:#C2410C; --c-personal:#8B3FD9; --c-other:#64748B; --c-office:#0F8F6A; --c-sub:#BE185D;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#16201D; --soft:#222E2A; --ink:#E8F0ED; --muted:#9DADA6; --line:#2A3834;
    --accent:#9DB4FF; --accent-ink:#0E1513;
    --good:#5ED6A3; --good-bg:#12342A; --warn:#F6BE5A; --warn-bg:#3A2B0E; --bad:#FF8F86; --bad-bg:#3C1B18;
    --c-home:#6FA2FF; --c-loan:#FF9A62; --c-personal:#C39BFF; --c-other:#9FB0C3; --c-office:#4FD6A8; --c-sub:#FF8FC4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --soft:#222E2A; --ink:#E8F0ED; --muted:#9DADA6; --line:#2A3834;
  --accent:#9DB4FF; --accent-ink:#0E1513;
  --good:#5ED6A3; --good-bg:#12342A; --warn:#F6BE5A; --warn-bg:#3A2B0E; --bad:#FF8F86; --bad-bg:#3C1B18;
  --c-home:#6FA2FF; --c-loan:#FF9A62; --c-personal:#C39BFF; --c-other:#9FB0C3; --c-office:#4FD6A8; --c-sub:#FF8FC4;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
.brand{font:700 1.25rem/1.1 var(--font-display);letter-spacing:-.01em}
.save{font-size:.72rem;color:var(--muted)}
.save.bad{color:var(--bad);font-weight:700}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px}

main.wrap{padding-block:16px 120px;display:grid;gap:16px;align-content:start}
.page{font:700 1.5rem/1.15 var(--font-display);letter-spacing:-.015em}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.sec{font:700 .74rem var(--font-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttl{font:700 1.05rem/1.2 var(--font-display)}
.grow{flex:1;min-width:0;display:grid;gap:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.between{justify-content:space-between;flex-wrap:nowrap}
.note{padding:10px 12px;border-radius:8px;background:var(--soft);font-size:.88rem}
.note.bad{background:var(--bad-bg);color:var(--bad)}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:600}

label{display:grid;gap:6px;font-weight:600;font-size:.88rem;min-width:0}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:130px;font-family:var(--font-num);font-size:.8rem}
input[type=checkbox]{width:20px;min-height:20px;height:20px;flex:none;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.form{gap:14px}
.lbl{font-weight:600;font-size:.88rem}
.err{color:var(--bad);font-weight:600;font-size:.88rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip .cx{background:none;border:0;padding:0 2px;color:inherit;font-size:1.1rem;line-height:1}
.ghost-chip{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 6px 18px rgba(0,0,0,.25)}
body.dragging{user-select:none;-webkit-user-select:none}
.loanbox{display:grid;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.drop{min-height:56px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:8px;text-align:center}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop.filled{border-style:solid;border-color:var(--accent);color:var(--ink)}

.pill{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.over{background:var(--bad-bg);color:var(--bad)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font:700 1.15rem var(--font-display)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:6px}
.hero .big{font:700 clamp(2.1rem,10vw,3rem)/1.05 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.arow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px}
.arow.over{background:var(--bad-bg)}
.arow.soon{background:var(--warn-bg)}
.arow.over strong{color:var(--bad)}
.arow.soon strong{color:var(--warn)}

.list{display:grid}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.lrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.amt{font-weight:600;white-space:nowrap}
.x{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:8px;flex:none}
.dayhead{display:flex;justify-content:space-between;font:700 .74rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:4px}

.brow{display:grid;gap:6px;width:100%;text-align:left;background:none;border:0;padding:8px 0}
.bhead{display:flex;align-items:center;gap:8px}
.track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.daily{display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--line)}
.dcol{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.dcol i{display:block;width:100%;background:var(--accent);opacity:.5;border-radius:2px 2px 0 0}
.dcol i.today{opacity:1}
.dcol i.zero{background:var(--line);opacity:1}
.dlab{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:4px}
.mchart{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:150px}
.mcol{display:grid;grid-template-rows:auto 1fr auto;gap:4px;border:0;background:none;padding:0;min-width:0;text-align:center}
.mval{font-size:.7rem;color:var(--muted)}
.mname{font-size:.74rem;color:var(--muted);font-weight:600}
.mbar{display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.mbar i{display:block;width:100%;background:var(--accent);opacity:.45;border-radius:3px 3px 0 0}
.mcol.sel .mbar i{opacity:1}
.mcol.sel .mname,.mcol.sel .mval{color:var(--ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:2px;min-width:0}
.stat .num{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.big-s{font-weight:600;font-size:1.05rem;white-space:nowrap}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:4px;padding-block:6px}
.tab{display:grid;justify-items:center;gap:2px;min-height:48px;padding:4px 0;border:0;background:none;color:var(--muted);font-size:.7rem;font-weight:600}
.tab[aria-current]{color:var(--accent)}
.tab.add{color:var(--ink)}
.tab .plus{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lockbox{width:100%;max-width:320px;display:grid;gap:16px;justify-items:center;text-align:center}
.dots{display:flex;gap:14px;min-height:16px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots span.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.keys button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 1.4rem var(--font-num)}
.keys .blank{visibility:hidden}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,18,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:16px}}
#sheetBody{display:grid;gap:14px;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="lock" class="lock"></div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="grow">
        <div class="brand">Kharcha Khata</div>
        <div id="saveState" class="save">Auto-save on</div>
      </div>
      <button class="icon-btn" data-act="tab" data-tab="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      <button class="icon-btn" data-act="lock" aria-label="Lock app"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
    </div>
  </header>
  <main id="view" class="wrap"></main>
  <nav id="tabs" class="tabs" aria-label="Main"></nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle" class="page"></h2>
    <form id="sheetForm" novalidate><div id="sheetBody"></div></form>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
const KEY_DATA='kk.data.v1', KEY_AUTH='kk.auth.v1';
const CATS=['Home','Loan','Personal','Other','Office','Subscription'];
const CVAR={Home:'--c-home',Loan:'--c-loan',Personal:'--c-personal',Other:'--c-other',Office:'--c-office',Subscription:'--c-sub'};
const LOAN_TYPES=['Home Loan','Car Loan','Personal Loan','Other Loan'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const round2=n=>Math.round(n*100)/100;
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});

/* ---------- storage ---------- */
let storageOk=true;
try{localStorage.setItem('kk.t','1');localStorage.removeItem('kk.t')}catch(e){storageOk=false}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){storageOk=false;return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const blank=()=>({expenses:[],emis:[],people:[],lent:[],settings:{alertDays:5}});
function load(){
  try{
    const r=lsGet(KEY_DATA);
    if(r){const o=JSON.parse(r);const b=blank();return {expenses:o.expenses||b.expenses,emis:o.emis||b.emis,people:o.people||b.people,lent:o.lent||b.lent,settings:Object.assign(b.settings,o.settings||{})}}
  }catch(e){}
  return blank();
}
let DB=load();
function save(){
  const ok=lsSet(KEY_DATA,JSON.stringify(DB));
  scheduleAlertsSoon();
  const s=$('#saveState');
  if(!s)return;
  if(ok){s.textContent='Saved '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});s.className='save'}
  else{s.textContent='Not saving';s.className='save bad'}
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>ymd(new Date());
const shiftDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const dim=(y,m)=>new Date(y,m,0).getDate();
function addMonths(s,n,day){
  const d=parseD(s);let y=d.getFullYear(),m=d.getMonth()+n;
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  const dd=Math.min(day||d.getDate(),dim(y,m+1));
  return y+'-'+pad(m+1)+'-'+pad(dd);
}
const monthLabel=k=>{const p=k.split('-').map(Number);return MONTHS[p[1]-1]+' '+p[0]};
const shiftMonth=(k,n)=>{const p=k.split('-').map(Number);const d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const fmtDate=s=>{const d=parseD(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
const fmtDateY=s=>fmtDate(s)+' '+parseD(s).getFullYear();

function compact(n){
  if(n>=100000)return (n/100000).toFixed(1).replace(/\.0$/,'')+'L';
  if(n>=1000)return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(n));
}

/* ---------- icons ---------- */
const I={
  dash:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  cal:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  people:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 010 5.8M18 14.5c1.9.8 3 2.6 3 5.5"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:36px;height:36px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'
};

/* ---------- state ---------- */
const UI={tab:'dash',ud:'borrow',month:today().slice(0,7),cat:'All',arm:null,open:{},draft:{amt:'',cat:'Home',note:'',date:today(),lt:'',lender:'',repay:true}};

/* ---------- calculations ---------- */
const sum=a=>a.reduce((s,e)=>s+e.amount,0);
const monthExpenses=k=>DB.expenses.filter(e=>e.date.slice(0,7)===k);
const emiDone=e=>!!(e.total&&e.paid>=e.total);
function emiInfo(e){
  if(emiDone(e))return {done:true};
  const days=daysBetween(today(),e.due);
  let st='ok';
  if(days<0)st='over';else if(days<=DB.settings.alertDays)st='soon';
  return {due:e.due,days:days,st:st};
}
function whenText(i){
  if(i.days<0)return 'Overdue by '+(-i.days)+(i.days===-1?' day':' days')+' ('+fmtDate(i.due)+')';
  if(i.days===0)return 'Due today';
  if(i.days===1)return 'Due tomorrow ('+fmtDate(i.due)+')';
  return 'Due in '+i.days+' days ('+fmtDate(i.due)+')';
}
function pillFor(i){
  if(i.done)return '<span class="pill good">Completed</span>';
  if(i.st==='over')return '<span class="pill over">Overdue '+(-i.days)+'d</span>';
  if(i.days===0)return '<span class="pill soon">Due today</span>';
  if(i.st==='soon')return '<span class="pill soon">Due in '+i.days+'d</span>';
  return '<span class="pill ok">In '+i.days+' days</span>';
}
function personStats(p){let b=0,r=0;p.entries.forEach(x=>{if(x.type==='borrow'||x.type==='lend')b+=x.amount;else r+=x.amount});return {b:b,r:r,rem:round2(b-r)}}
const findPerson=n=>{const t=String(n||'').trim().toLowerCase();return t?DB.people.find(p=>p.name.trim().toLowerCase()===t):null};
function knownLenders(){
  const s=new Set();
  DB.people.forEach(p=>s.add(p.name));
  DB.emis.forEach(e=>{if(e.lender)s.add(e.lender)});
  DB.expenses.forEach(e=>{if(e.lender)s.add(e.lender)});
  return Array.from(s).sort((a,b)=>a.localeCompare(b));
}

function monthNav(){

}
function vDash(){

  const al=DB.emis.map(e=>({e:e,i:emiInfo(e)})).filter(x=>!x.i.done&&(x.i.st==='over'||x.i.st==='soon')).sort((a,b)=>a.i.days-b.i.days);

    h+='<section class="card"><h2 class="sec"><span>EMI alerts</span><span>'+DB.settings.alertDays+' days before due</span></h2>'+al.map(x=>'<div class="arow '+x.i.st+'"><div class="grow"><strong>'+esc(x.e.name)+'</strong><span class="small">'+inr(x.e.amount)+' · '+whenText(x.i)+'</span></div><button class="btn small primary" data-act="payEmi" data-id="'+x.e.id+'">Mark paid</button></div>').join('')+'</section>';
  }

  let delta='';
  if(prev>0){const d=tot-prev;delta='<p class="muted small">'+inr(Math.abs(d))+(d>=0?' more':' less')+' than '+monthLabel(prevK)+' ('+inr(prev)+')</p>'}
  else delta='<p class="muted small">'+list.length+(list.length===1?' entry':' entries')+' this month</p>';
  h+='<section class="hero"><span class="sec">Spent in '+monthLabel(k)+'</span><div class="big">'+inr(tot)+'</div>'+delta+'</section>';

    const p=k.split('-').map(Number),n=dim(p[0],p[1]);
  const arr=Array(n).fill(0);
  list.forEach(e=>{arr[Number(e.date.slice(8,10))-1]+=e.amount});
  const mx=Math.max.apply(null,arr),td=today();
  const peak=arr.indexOf(mx);
  h+='<section class="card"><h2 class="sec"><span>Day by day</span><span>'+(mx>0?'Highest '+inr(mx)+' on '+fmtDate(k+'-'+pad(peak+1)):'')+'</span></h2><div class="daily" role="img" aria-label="Daily spending for '+monthLabel(k)+'">'+arr.map((v,i)=>{
    const d=k+'-'+pad(i+1);
    const cls=v===0?'zero':(d===td?'today':'');
    const ht=v===0?'2px':Math.max(v/mx*100,3).toFixed(1)+'%';
    return '<div class="dcol" title="'+fmtDate(d)+': '+inr(v)+'"><i class="'+cls+'" style="height:'+ht+'"></i></div>';
  }).join('')+'</div><div class="dlab"><span>1</span><span>'+Math.ceil(n/2)+'</span><span>'+n+'</span></div></section>';

  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(k,-i));
  const tots=ms.map(m=>sum(monthExpenses(m)));
  const mx6=Math.max.apply(null,tots);
  h+='<section class="card"><h2 class="sec"><span>Last 6 months</span><span>Tap a bar to open it</span></h2><div class="mchart">'+ms.map((m,i)=>{
    const v=tots[i];
    const ht=v?Math.max(v/mx6*100,3).toFixed(1)+'%':'2px';
    return '<button class="mcol'+(m===k?' sel':'')+'" data-act="setMonth" data-m="'+m+'" aria-label="'+monthLabel(m)+': '+inr(v)+'"><span class="mval num">'+(v?compact(v):'0')+'</span><span class="mbar"><i style="height:'+ht+'"></i></span><span class="mname">'+MONTHS[Number(m.slice(5))-1].slice(0,3)+'</span></button>';
  }).join('')+'</div><p class="muted small">Amounts in rupees (k = thousand, L = lakh)</p></section>';

  const by={};list.forEach(e=>{by[e.category]=(by[e.category]||0)+e.amount});

  if(!rows.length)h+='<p class="muted">No expenses in '+monthLabel(k)+' yet.</p>';
  else h+=rows.map(c=>{
    const pct=by[c]/tot*100;
    let sub='';
    if(c==='Loan'){
      const lt={};list.filter(e=>e.category==='Loan').forEach(e=>{const n=e.loanType||'Loan';lt[n]=(lt[n]||0)+e.amount});
      sub='<span class="muted small">'+Object.keys(lt).map(n=>esc(n)+' '+inr(lt[n])).join(' · ')+'</span>';
    }
    return '<button class="brow" data-act="goCat" data-c="'+c+'"><span class="bhead"><span class="dot" style="background:var(--'+CVAR[c].slice(2)+')"></span><strong class="grow">'+c+'</strong><span class="muted small">'+pct.toFixed(0)+'%</span><span class="num amt">'+inr(by[c])+'</span></span><span class="track"><i style="width:'+pct.toFixed(1)+'%;background:var('+CVAR[c]+')"></i></span>'+sub+'</button>';
  }).join('');
  h+='</section>';


  const ps=DB.people.map(x=>({p:x,s:personStats(x)})).filter(x=>x.s.rem>0).sort((a,b)=>b.s.rem-a.s.rem);
  const owe=ps.reduce((s,x)=>s+x.s.rem,0);
  h+='<section class="card"><h2 class="sec"><span>Money to give back</span><span class="num">'+inr(owe)+'</span></h2>';
  if(!ps.length)h+='<p class="muted">Nothing pending.</p>';
  else h+='<div class="list">'+ps.map(x=>'<div class="lrow"><span class="grow"><strong>'+esc(x.p.name)+'</strong><span class="muted small">Repaid '+inr(x.s.r)+' of '+inr(x.s.b)+'</span></span><span class="num amt">'+inr(x.s.rem)+'</span></div>').join('')+'</div>';
  h+='</section>';

    const rs=DB.lent.map(x=>({p:x,s:personStats(x)})).filter(x=>x.s.rem>0).sort((a,b)=>b.s.rem-a.s.rem);
  const rec=rs.reduce((s,x)=>s+x.s.rem,0);
  h+='<section class="card"><h2 class="sec"><span>Money to receive</span><span class="num">'+inr(rec)+'</span></h2>';
  if(!rs.length)h+='<p class="muted">Nobody owes you right now.</p>';
  else h+='<div class="list">'+rs.map(x=>'<div class="lrow"><span class="grow"><strong>'+esc(x.p.name)+'</strong><span class="muted small">Received '+inr(x.s.r)+' of '+inr(x.s.b)+'</span></span><span class="num amt">'+inr(x.s.rem)+'</span></div>').join('')+'</div>';
  h+='</section>';

  const up=DB.emis.filter(e=>!emiDone(e)).sort((a,b)=>a.due<b.due?-1:1);
  const mon=sum(up);
  h+='<section class="card"><h2 class="sec"><span>EMI dates</span><span class="num">'+inr(mon)+' / month</span></h2>';
  if(!up.length)h+='<p class="muted">No EMIs added yet.</p>';
  else h+='<div class="list">'+up.slice(0,5).map(e=>{const i=emiInfo(e);return '<div class="lrow"><span class="grow"><strong>'+esc(e.name)+'</strong><span class="muted small">'+fmtDateY(e.due)+'</span></span>'+pillFor(i)+'<span class="num amt">'+inr(e.amount)+'</span></div>'}).join('')+'</div><button class="link" data-act="tab" data-tab="emi">All EMIs</button>';
  h+='</section>';
  return h;
}

/* ---------- toast & sheet ---------- */
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
let sheetSubmit=null;
function openSheet(title,body,submit,ok,noCancelLabel){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=body+'<p class="err" id="sheetErr" hidden></p><div class="row end"><button type="button" class="btn ghost" data-act="closeSheet">Cancel</button><button type="submit" class="btn primary">'+(ok||'Save')+'</button></div>';
  sheetSubmit=submit;
  $('#sheetWrap').hidden=false;
  const first=$('#sheetBody input:not([type=checkbox]),#sheetBody select,#sheetBody textarea');
  if(first)setTimeout(()=>first.focus(),30);
}
function closeSheet(){$('#sheetWrap').hidden=true;sheetSubmit=null}
$('#sheetForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(!sheetSubmit)return;
  let r;
  try{r=await sheetSubmit(new FormData(ev.target))}catch(err){r='Something went wrong. Please try again.'}
  const er=$('#sheetErr');
  if(r===true)closeSheet();
  else if(typeof r==='string'&&er){er.textContent=r;er.hidden=false}
});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});

function arm(key,fn){
  if(UI.arm===key){UI.arm=null;fn()}
  else{UI.arm=key;render();setTimeout(()=>{if(UI.arm===key){UI.arm=null;render()}},3000)}
}

function submitAdd(){
  const d=UI.draft,amt=parseFloat(d.amt);
  if(!(amt>0)){toast('Enter an amount first');const f=$('#fAmt');if(f)f.focus();return}

/* ---------- PIN lock ---------- */
let auth=null;
try{auth=JSON.parse(lsGet(KEY_AUTH)||'null')}catch(e){auth=null}
let lockMode=auth?'enter':'setup1',buf='',first='',err='',busy=false,hiddenAt=0,unlocked=false,fails=0,lockUntil=0;
async function hashPin(pin,salt){
  const s=salt+':'+pin;
  try{
    const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
    return 'x'+(h>>>0).toString(16);
  }
}
function renderLock(){
  const T={setup1:'Create a PIN',setup2:'Confirm your PIN',enter:'Enter PIN'};
  const S={setup1:'Choose a 4-digit PIN. The app will ask for it every time it opens.',setup2:'Type the same PIN once more.',enter:'Kharcha Khata is locked.'};
  let keys='';
  ['1','2','3','4','5','6','7','8','9'].forEach(k=>{keys+='<button type="button" data-k="'+k+'">'+k+'</button>'});
  keys+='<button type="button" class="blank" tabindex="-1" aria-hidden="true"></button><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Delete digit">⌫</button>';
  $('#lock').innerHTML='<div class="lockbox">'+I.lock+'<h1 class="page">'+T[lockMode]+'</h1><p class="muted">'+S[lockMode]+'</p><div class="dots'+(err?' shake':'')+'">'+[0,1,2,3].map(i=>'<span class="'+(i<buf.length?'on':'')+'"></span>').join('')+'</div><p class="err" style="min-height:1.4em">'+esc(err)+'</p><div class="keys">'+keys+'</div>'+(lockMode==='enter'?'<button type="button" class="link" data-act="forgot">Forgot PIN?</button>':'')+'</div>';
}
async function press(k){
  if(busy)return;
  err='';
  if(k==='del'){buf=buf.slice(0,-1);renderLock();return}
  if(buf.length>=4)return;
  buf+=k;renderLock();
  if(buf.length<4)return;
  busy=true;
  const pin=buf;
  if(lockMode==='setup1'){first=pin;buf='';lockMode='setup2'}
  else if(lockMode==='setup2'){
    if(pin===first){
      const salt=uid();auth={salt:salt,hash:await hashPin(pin,salt)};
      lsSet(KEY_AUTH,JSON.stringify(auth));
      busy=false;unlock();setTimeout(()=>openSecuritySheet(false),300);return;
    }
    err='PINs did not match. Start again.';buf='';first='';lockMode='setup1';
  }else{
    if(await hashPin(pin,auth.salt)===auth.hash){busy=false;unlock();return}
    err='Wrong PIN. Try again.';buf='';
  }
  busy=false;renderLock();
}
function unlock(){
  lockMode='enter';buf='';first='';err='';unlocked=true;
  $('#lock').hidden=true;$('#app').hidden=false;
  render();window.scrollTo(0,0);scheduleAlerts();
}
function lockNow(){
  if(!auth)return;
  closeSheet();
  unlocked=false;buf='';err='';lockMode='enter';
  $('#app').hidden=true;$('#lock').hidden=false;renderLock();
}
$('#lock').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k)press(k.dataset.k)});
document.addEventListener('keydown',e=>{
  if($('#lock').hidden||!$('#sheetWrap').hidden)return;
  if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(unlocked&&hiddenAt&&Date.now()-hiddenAt>60000)lockNow();
});
function openPinSheet(){
  const f=(n,l)=>'<label>'+l+'<input name="'+n+'" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>';
  openSheet('Change PIN',f('cur','Current PIN')+f('n1','New PIN (4 digits)')+f('n2','New PIN again'),async fd=>{
    const cur=String(fd.get('cur')||''),n1=String(fd.get('n1')||''),n2=String(fd.get('n2')||'');
    if(await hashPin(cur,auth.salt)!==auth.hash)return 'Current PIN is wrong.';
    if(!/^\d{4}$/.test(n1))return 'New PIN must be exactly 4 digits.';
    if(n1!==n2)return 'The new PINs do not match.';
    auth={salt:auth.salt,hash:await hashPin(n1,auth.salt),sq:auth.sq};
    lsSet(KEY_AUTH,JSON.stringify(auth));toast('PIN changed');return true;
  },'Change PIN');
}

/* ---------- security questions and PIN reset ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
const SQ_IDEAS=["What was the name of your first school?","What is your mother's birthplace?","What was your first pet's name?","In which city did your parents meet?","What was your childhood nickname?","What is your favourite teacher's name?"];
function openSecuritySheet(requirePin){
  if(!auth)return;
  const cur=auth.sq||[{q:''},{q:''}];
  const pinField=requirePin?'<label>Current PIN<input name="cur" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>':'';
  const qa=i=>'<label>Question '+(i+1)+'<input name="q'+(i+1)+'" list="sqlist" autocomplete="off" placeholder="Pick one or type your own" value="'+esc(cur[i].q)+'"></label><label>Answer '+(i+1)+'<input name="a'+(i+1)+'" autocomplete="off"></label>';
  openSheet('Security questions',
    '<p class="muted">If you forget your PIN, answering both questions lets you set a new one. Choose answers only you know. Capital letters do not matter.</p>'+pinField+
    '<datalist id="sqlist">'+SQ_IDEAS.map(q=>'<option value="'+esc(q)+'"></option>').join('')+'</datalist>'+qa(0)+qa(1),
    async fd=>{
      if(requirePin&&(await hashPin(String(fd.get('cur')||''),auth.salt))!==auth.hash)return 'Current PIN is wrong.';
      const q1=String(fd.get('q1')||'').trim(),q2=String(fd.get('q2')||'').trim(),a1=norm(fd.get('a1')),a2=norm(fd.get('a2'));
      if(!q1||!q2)return 'Add both questions.';
      if(norm(q1)===norm(q2))return 'Use two different questions.';
      if(a1.length<2||a2.length<2)return 'Each answer needs at least 2 characters.';
      auth={salt:auth.salt,hash:auth.hash,sq:[{q:q1,h:await hashPin(a1,auth.salt+'q0')},{q:q2,h:await hashPin(a2,auth.salt+'q1')}]};
      lsSet(KEY_AUTH,JSON.stringify(auth));
      if(unlocked)render();
      toast('Security questions saved');return true;
    },'Save questions');
}
function eraseResetSheet(note){
  confirmSheet('Reset PIN?',(note||'')+'This erases all expenses, EMIs and borrowings on this device and lets you create a new PIN. You can restore from a backup afterwards.','Erase and reset',()=>{DB=blank();lsDel(KEY_DATA);lsDel(KEY_AUTH);auth=null;lockMode='setup1';buf='';first='';err='';renderLock()});
}
function openForgotSheet(){
  if(!auth||!auth.sq||auth.sq.length<2){eraseResetSheet('No security questions were set, so the only way to reset is to start fresh. ');return}
  const f=(n,l,pw)=>'<label>'+l+'<input name="'+n+'"'+(pw?' type="password" inputmode="numeric" maxlength="4"':'')+' autocomplete="off"></label>';
  openSheet('Reset PIN',
    '<p class="muted">Answer your two security questions to choose a new PIN. Your data stays safe.</p>'+f('a1',esc(auth.sq[0].q))+f('a2',esc(auth.sq[1].q))+f('n1','New PIN (4 digits)',true)+f('n2','New PIN again',true)+
    '<button type="button" class="link" data-act="eraseReset">I do not remember the answers</button>',
    async fd=>{
      if(Date.now()<lockUntil)return 'Too many wrong tries. Wait a minute and try again.';
      const a1=norm(fd.get('a1')),a2=norm(fd.get('a2')),n1=String(fd.get('n1')||''),n2=String(fd.get('n2')||'');
      if(!a1||!a2)return 'Answer both questions.';
      if(!/^\d{4}$/.test(n1))return 'New PIN must be exactly 4 digits.';
      if(n1!==n2)return 'The new PINs do not match.';
      const ok=(await hashPin(a1,auth.salt+'q0'))===auth.sq[0].h&&(await hashPin(a2,auth.salt+'q1'))===auth.sq[1].h;
      if(!ok){
        fails++;
        if(fails>=5){fails=0;lockUntil=Date.now()+60000;return 'Too many wrong tries. Wait a minute and try again.'}
        const left=5-fails;
        return 'Those answers do not match. '+left+(left===1?' try':' tries')+' left.';
      }
      fails=0;
      const salt=uid();
      auth={salt:salt,hash:await hashPin(n1,salt),sq:[{q:auth.sq[0].q,h:await hashPin(a1,salt+'q0')},{q:auth.sq[1].q,h:await hashPin(a2,salt+'q1')}]};
      lsSet(KEY_AUTH,JSON.stringify(auth));
      unlock();toast('New PIN set. Welcome back.');return true;
    },'Set new PIN');
}

/* ---------- phone notifications (only inside the Android app) ---------- */
const NATIVE=!!window.KKNative;
const hashInt=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)%200000};
let alertT=null,askedPerm=false;
function scheduleAlertsSoon(){if(!NATIVE)return;clearTimeout(alertT);alertT=setTimeout(scheduleAlerts,600)}
function scheduleAlerts(){
  if(!NATIVE)return;
  try{
    if(!askedPerm){askedPerm=true;window.KKNative.requestPermission()}
    const offs=Array.from(new Set([DB.settings.alertDays,1,0,-1,-2])),now=Date.now(),list=[];
    DB.emis.forEach(e=>{
      if(emiDone(e))return;
      const base=hashInt(e.id)*10;
      offs.forEach((off,idx)=>{
        const p=shiftDays(e.due,-off).split('-').map(Number);
        const at=new Date(p[0],p[1]-1,p[2],9,0,0).getTime();
        if(at<=now)return;
        const title=off>1?'EMI due in '+off+' days':off===1?'EMI due tomorrow':off===0?'EMI due today':'EMI overdue';
        list.push({id:base+idx,title:title,body:e.name+': '+inr(e.amount)+' ('+fmtDate(e.due)+')',at:at});
      });
    });
    window.KKNative.scheduleAlerts(JSON.stringify(list));
  }catch(e){}
}
